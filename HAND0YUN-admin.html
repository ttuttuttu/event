<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOYUN · ADMIN</title><style>body{background:#0e1d38;color:#f3e5c6;font-family:system-ui,sans-serif;max-width:700px;margin:45px auto;padding:20px}input,button,select{padding:12px;margin:5px;border-radius:7px}button{background:#d9bd7d;color:#15233e;border:0;cursor:pointer}section{border:1px solid #a38b59;padding:18px;border-radius:12px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#d6c9ac}</style></head><body><h1>DOYUN · ADMIN</h1><p>관리자 전용 · 처음 한 번 각 이벤트의 카드 200장을 생성합니다.</p><section><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">관리자 로그인</button><p id="status">로그인이 필요합니다.</p></section><section id="controls" hidden><p>처음 배정은 각 이벤트당 한 번만 실행하세요. 기존 카드가 있으면 생성을 거부합니다.</p><button id="test">테스트용 200장 생성</button><button id="mutual">맞팔용 200장 생성</button><button id="general">일반용 200장 생성</button><button id="refresh">참여 현황 새로고침</button><pre id="out"></pre></section><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyDvcTXRqS3hvDUxVzQYehmNVInfZrBTFfs",
  authDomain: "birthday-lucky-draw-1111.firebaseapp.com",
  projectId: "birthday-lucky-draw-1111",
  storageBucket: "birthday-lucky-draw-1111.firebasestorage.app",
  messagingSenderId: "491973836090",
  appId: "1:491973836090:web:5b8b9aa06cb6275c2ae403"
};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);const prizes=[...Array(1).fill("1등"),...Array(1).fill("2등"),...Array(2).fill("3등"),...Array(5).fill("11.11 SPECIAL ①"),...Array(5).fill("11.11 SPECIAL ②"),...Array(186).fill("꽝")];
function shuffle(a){for(let i=a.length-1;i>0;i--){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const j=bytes[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
auth.onAuthStateChanged(u=>{$("#controls").hidden=!u;$("#status").textContent=u?"로그인됨 · UID: "+u.uid:"로그인이 필요합니다."});
$("#login").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("#email").value,$("#password").value);$("#password").value=""}catch(e){alert(e.message)}};
async function seed(event){if(!confirm(event+" 이벤트 카드 200장을 최초 생성할까요?"))return;const col=db.collection("events").doc(event).collection("tickets");try{const existing=await col.limit(1).get();if(!existing.empty)throw Error("이미 카드가 있습니다. 덮어쓰지 않았습니다.");const shuffled=shuffle([...prizes]);const batch=db.batch();shuffled.forEach((prize,i)=>batch.set(col.doc(String(i+1)),{prize,picked:false}));await batch.commit();$("#out").textContent=event+" 카드 200장 생성 완료."}catch(e){alert(e.message)}}
$("#test").onclick=()=>seed("test");$("#mutual").onclick=()=>seed("mutual");$("#general").onclick=()=>seed("general");$("#refresh").onclick=async()=>{try{let lines=[];for(const ev of ["test","mutual","general"]){const snap=await db.collection("events").doc(ev).collection("tickets").get();const picked=snap.docs.filter(x=>x.data().picked);lines.push(ev+": "+picked.length+" / "+snap.size+" 참여",...picked.map(d=>`${d.id}번 · ${d.data().nickname} · ${d.data().prize}`))}$("#out").textContent=lines.join("\n")}catch(e){alert(e.message)}};
</script></body></html>
