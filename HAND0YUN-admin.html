<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOYUN · ADMIN</title>
<style>
:root{color-scheme:dark;--bg:#0b1830;--panel:#142747;--panel2:#1a3155;--line:#50617b;--gold:#e8cc91;--muted:#b7c5d7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#213a63 0,transparent 45%),var(--bg);color:#f7eedb;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}[hidden]{display:none!important}.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:var(--panel);border:1px solid #947d55;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0005}.eyebrow{font-size:11px;letter-spacing:.25em;color:var(--gold);font-weight:800}.login-card h1{margin:12px 0 7px;font-size:28px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.field{display:block;margin:22px 0 0;font-size:13px;color:var(--gold)}input{width:100%;margin-top:8px;background:#0c1b33;border:1px solid #62718a;border-radius:9px;padding:13px;color:#fff;outline-offset:3px}input:focus{border-color:var(--gold)}.primary{border:0;border-radius:9px;background:var(--gold);color:#182642;font-weight:800;padding:13px 16px}.login-card .primary{width:100%;margin-top:23px}.error{color:#ffd1ca;font-size:13px;overflow-wrap:anywhere;min-height:20px}.app{max-width:1250px;margin:auto;padding:25px 20px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #536582;padding-bottom:20px;margin-bottom:23px}.top h1{margin:5px 0 0;font-size:24px}.top button,.ghost{background:transparent;color:var(--gold);border:1px solid #9d875d;border-radius:8px;padding:10px 13px}.dashboard{display:grid;grid-template-columns:245px minmax(0,1fr);gap:20px}.side,.content{background:var(--panel);border:1px solid #50617b;border-radius:15px;padding:17px}.side h2{font-size:13px;color:var(--gold);letter-spacing:.09em;margin:0 0 15px}.event{display:block;width:100%;text-align:left;border:1px solid #536582;background:#11213b;color:#f7eedb;border-radius:10px;padding:15px;margin-bottom:10px}.event strong,.event small{display:block}.event small{margin-top:6px;color:var(--muted)}.event.active{border-color:var(--gold);background:#304366}.side-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:20px}.content-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.content-head h2{margin:0;font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.summary{color:var(--muted);font-size:13px;margin:14px 0 20px}.prize-list{display:grid;gap:12px}.prize{border:1px solid #52647d;border-radius:11px;background:var(--panel2);overflow:hidden}.prize-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid #415875}.prize-head strong{font-size:15px}.prize-head span{font-size:12px;color:var(--gold)}.entries{padding:10px 15px}.entry{display:grid;grid-template-columns:75px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid #3e5270;font-size:13px}.entry:last-child{border:0}.entry .number{color:var(--gold);font-variant-numeric:tabular-nums}.handle{overflow-wrap:anywhere}.empty{font-size:13px;color:var(--muted);padding:8px 0}.message{font-size:13px;color:var(--gold);min-height:18px;margin:14px 0 0;overflow-wrap:anywhere}@media(max-width:650px){.app{padding:18px 12px}.dashboard{grid-template-columns:1fr}.side{padding:12px}.side .event{margin-bottom:7px}.content{padding:13px}.top h1{font-size:20px}.content-head h2{font-size:19px}}
</style></head><body>
<div class="login-wrap" id="loginView"><form class="login-card" id="loginForm"><div class="eyebrow">PRIVATE ACCESS · 11.11</div><h1>DOYUN · ADMIN</h1><p class="muted">관리자 로그인 후 이벤트별 결과를 확인할 수 있습니다.</p><label class="field">관리자 이메일<input id="email" type="email" autocomplete="username" required placeholder="이메일"></label><label class="field">비밀번호<input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호"></label><button class="primary" id="loginBtn" type="submit">로그인</button><p class="error" id="loginError" role="alert"></p></form></div>
<div class="app" id="appView" hidden><header class="top"><div><div class="eyebrow">PRIVATE DASHBOARD</div><h1>DOYUN · ADMIN</h1></div><button id="logout" type="button">로그아웃</button></header><div class="dashboard"><aside class="side"><h2>EVENT LIST</h2><button type="button" class="event active" data-event="test"><strong>테스트용</strong><small id="side-test">참여 현황 불러오는 중</small></button><button type="button" class="event" data-event="mutual"><strong>맞팔용</strong><small id="side-mutual">참여 현황 불러오는 중</small></button><button type="button" class="event" data-event="general"><strong>일반용</strong><small id="side-general">참여 현황 불러오는 중</small></button><p class="side-note">이벤트를 누르면 오른쪽에서 상품별 당첨 결과를 확인할 수 있어요. 참여하지 않은 카드의 결과는 표시하지 않습니다.</p></aside><section class="content"><div class="content-head"><h2 id="eventTitle">테스트용 · 결과 확인</h2><div class="actions"><button type="button" class="ghost" id="refresh">새로고침</button><button type="button" class="primary" id="seed">카드 200장 최초 생성</button></div></div><p class="summary" id="summary">불러오는 중...</p><div class="prize-list" id="prizeList" aria-live="polite"></div><p class="message" id="message" role="status"></p></section></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
// GitHub의 기존 관리자 HTML에 입력했던 firebaseConfig 값을 이곳에 그대로 붙여 넣으세요.
const firebaseConfig = {
  apiKey: "PASTE_API_KEY", authDomain: "PASTE_AUTH_DOMAIN",
  projectId: "PASTE_PROJECT_ID", storageBucket: "PASTE_STORAGE_BUCKET",
  messagingSenderId: "PASTE_MESSAGING_SENDER_ID", appId: "PASTE_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);
const LABEL={test:"테스트용",mutual:"맞팔용",general:"일반용"};
const GROUPS=[{name:"1등",match:["1등"],total:1},{name:"2등",match:["2등"],total:1},{name:"3등",match:["3등"],total:2},{name:"11.11 SPECIAL ①",match:["11.11 SPECIAL ①"],total:5},{name:"11.11 SPECIAL ②",match:["11.11 SPECIAL ②"],total:5},{name:"꽝",match:["꽝"],total:186}];
const prizes=GROUPS.flatMap(g=>Array(g.total).fill(g.name));let selected="test",loadSeq=0,working=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let bytes=new Uint32Array(1);crypto.getRandomValues(bytes);let j=bytes[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(snap){const docs=snap.docs.map(d=>({number:Number(d.id),...d.data()}));const picked=docs.filter(d=>d.picked);$("#summary").textContent=`전체 ${snap.size}장 · 참여 ${picked.length}명 · 남은 카드 ${Math.max(0,snap.size-picked.length)}장`;$("#prizeList").replaceChildren();for(const group of GROUPS){const entries=picked.filter(d=>group.match.includes(d.prize)).sort((a,b)=>a.number-b.number);const section=el("section","prize");const head=el("div","prize-head");head.append(el("strong","",group.name),el("span","",`${entries.length} / ${group.total}명`));section.append(head);const list=el("div","entries");if(!entries.length)list.append(el("div","empty","아직 참여 기록이 없습니다."));for(const entry of entries){const row=el("div","entry");row.append(el("span","number",`${entry.number}번`),el("span","handle",entry.nickname||"아이디 미기록"));list.append(row)}section.append(list);$("#prizeList").append(section)}}
async function load(){if(!auth.currentUser)return;const event=selected,seq=++loadSeq;$("#summary").textContent="참여 기록을 불러오는 중...";$("#message").textContent="";try{const snap=await db.collection("events").doc(event).collection("tickets").get();if(seq!==loadSeq)return;render(snap);$("#side-"+event).textContent=`${snap.docs.filter(d=>d.data().picked).length} / ${snap.size} 참여`}catch(e){if(seq!==loadSeq)return;$("#summary").textContent="불러오지 못했습니다.";$("#message").textContent=e.message}}
async function refreshAll(){if(!auth.currentUser)return;await load();for(const event of Object.keys(LABEL)){if(event===selected)continue;try{const snap=await db.collection("events").doc(event).collection("tickets").get();$("#side-"+event).textContent=`${snap.docs.filter(d=>d.data().picked).length} / ${snap.size} 참여`}catch(e){$("#side-"+event).textContent="조회 실패"}}}
function select(event){selected=event;document.querySelectorAll(".event").forEach(b=>{const active=b.dataset.event===event;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});$("#eventTitle").textContent=LABEL[event]+" · 결과 확인";load()}
document.querySelectorAll(".event").forEach(b=>b.addEventListener("click",()=>select(b.dataset.event)));
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginError").textContent="";$("#loginBtn").disabled=true;try{await auth.signInWithEmailAndPassword($("#email").value,$("#password").value);$("#password").value=""}catch(err){$("#loginError").textContent=err.message}finally{$("#loginBtn").disabled=false}});
auth.onAuthStateChanged(user=>{$("#loginView").hidden=!!user;$("#appView").hidden=!user;if(user){select(selected);refreshAll()}else{++loadSeq;$("#prizeList").replaceChildren()}});
$("#logout").addEventListener("click",()=>auth.signOut().catch(e=>alert(e.message)));$("#refresh").addEventListener("click",refreshAll);
$("#seed").addEventListener("click",async()=>{if(working)return;const event=selected;if(!confirm(`${LABEL[event]} 카드 200장을 최초 생성할까요? 기존 카드가 있으면 덮어쓰지 않습니다.`))return;working=true;$("#seed").disabled=true;$("#message").textContent="생성 중...";try{const col=db.collection("events").doc(event).collection("tickets");const existing=await col.limit(1).get();if(!existing.empty)throw Error("이미 카드가 있습니다. 기존 카드는 변경하지 않았습니다.");const batch=db.batch();shuffle([...prizes]).forEach((prize,i)=>batch.set(col.doc(String(i+1)),{prize,picked:false}));await batch.commit();$("#message").textContent=`${LABEL[event]} 카드 200장 생성 완료.`;await refreshAll()}catch(e){$("#message").textContent=e.message}finally{working=false;$("#seed").disabled=false}});
</script></body></html>
