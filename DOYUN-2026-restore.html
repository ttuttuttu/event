<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOYUN-2026 복원 도구</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f5f7ff;max-width:680px;margin:30px auto;padding:18px;line-height:1.65}button,input{font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#80d8ff;color:#07101e;font-weight:bold;margin:6px 6px 6px 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202c42;padding:12px;border-radius:10px}label{display:block;margin:16px 0}input{max-width:100%}small{color:#b6c2d6}</style></head><body><h1>DOYUN-2026 데이터 복원</h1><p>기존 일반용 뽑기 기록을 새 Firebase에 복원하는 <b>관리자 전용</b> 도구입니다. GitHub에 업로드하지 말고 개인 기기에서만 사용하세요.</p><button id="login">① Google 로그인</button><button id="logout">로그아웃</button><p>로그인 상태: <b id="who">확인 중</b></p><p>관리자 UID (복사해서 보안 규칙에 사용):</p><pre id="uid">로그인 전</pre><hr><label>② 백업 JSON 파일 선택<br><input id="file" type="file" accept=".json,application/json"></label><p id="summary">파일을 선택해 주세요.</p><button id="restore" disabled>③ 복원 시작</button><pre id="status">관리자 UID를 확인하고 Firestore 규칙을 설정한 뒤 복원하세요.</pre><small>복원 전에 대상 데이터베이스가 비어 있는지 확인합니다. 이미 데이터가 있으면 중단합니다. 기존 Firebase에는 접속하지 않습니다.</small><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCJXaEaB3aAkXRukNtrkHNcR7ig0YMBgZE",authDomain:"doyun-2026.firebaseapp.com",projectId:"doyun-2026",storageBucket:"doyun-2026.firebasestorage.app",messagingSenderId:"820277254538",appId:"1:820277254538:web:40a15e3cfcc7297d6b9073"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);let backup=null,busy=false;
function update(){const u=auth.currentUser;$('#who').textContent=u?u.email||'로그인됨':'로그아웃';$('#uid').textContent=u?u.uid:'로그인 전';$('#restore').disabled=!u||!backup||busy}
auth.onAuthStateChanged(update);$('#login').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert('로그인 실패: '+e.message)}};$('#logout').onclick=()=>auth.signOut();
$('#file').onchange=async e=>{backup=null;try{const f=e.target.files[0];if(!f)return;const obj=JSON.parse(await f.text());if(obj.format!=='doyun-firestore-backup-v1'||obj.eventId!=='general'||!Array.isArray(obj.tickets)||!Array.isArray(obj.nicknames))throw Error('일반용 백업 파일이 아닙니다.');const ids=obj.tickets.map(t=>t.id),keys=obj.nicknames.map(n=>n.id);if(ids.length!==200||new Set(ids).size!==200||!Array.from({length:200},(_,i)=>String(i+1)).every(id=>ids.includes(id)))throw Error('카드가 정확히 1~200번인지 확인해 주세요.');if(new Set(keys).size!==keys.length)throw Error('중복 X 아이디가 있습니다.');const picked=obj.tickets.filter(t=>t.data.picked);if(picked.length!==obj.nicknames.length)throw Error('참여자 수와 뽑힌 카드 수가 다릅니다.');for(const n of obj.nicknames){const t=obj.tickets.find(t=>t.id===String(n.data.ticketNumber));if(!t||!t.data.picked||t.data.nicknameKey!==n.id)throw Error('참여자 기록이 일치하지 않습니다.')}backup=obj;$('#summary').textContent=`확인 완료: 카드 ${ids.length}장 / 참여 기록 ${keys.length}명 / 남은 카드 ${200-picked.length}장`;$('#status').textContent='파일 검사 통과. 관리자 권한 규칙을 설정한 뒤 복원 시작을 누르세요.'}catch(err){$('#summary').textContent='파일 오류: '+err.message}update()};
function decode(v){if(Array.isArray(v))return v.map(decode);if(v&&typeof v==='object'){if(v.__firestoreType==='timestamp')return new firebase.firestore.Timestamp(v.seconds,v.nanoseconds);const o={};for(const [k,x] of Object.entries(v))o[k]=decode(x);return o}return v}
$('#restore').onclick=async()=>{if(!backup||!auth.currentUser||busy)return;if(!confirm('새 doyun-2026 프로젝트가 비어 있는지 확인하고 카드 200장과 참여 기록을 복원합니다. 진행할까요?'))return;busy=true;update();try{const base=db.collection('events').doc('general');$('#status').textContent='새 프로젝트에 기존 데이터가 있는지 확인 중...';const [t,n]=await Promise.all([base.collection('tickets').limit(1).get(),base.collection('nicknames').limit(1).get()]);if(!t.empty||!n.empty)throw Error('대상 프로젝트에 이미 카드 또는 참여 기록이 있어 중단했습니다. 기존 데이터를 덮어쓰지 않습니다.');const rows=[...backup.tickets.map(x=>({ref:base.collection('tickets').doc(x.id),data:decode(x.data)})),...backup.nicknames.map(x=>({ref:base.collection('nicknames').doc(x.id),data:decode(x.data)}))];let done=0;for(let i=0;i<rows.length;i+=100){const batch=db.batch();for(const row of rows.slice(i,i+100))batch.set(row.ref,row.data);await batch.commit();done+=Math.min(100,rows.length-i);$('#status').textContent=`복원 중... ${done}/${rows.length}건 완료`;}const [tc,nc]=await Promise.all([base.collection('tickets').get(),base.collection('nicknames').get()]);if(tc.size!==200||nc.size!==backup.nicknames.length)throw Error(`복원 후 개수 불일치: 카드 ${tc.size}, 참여 ${nc.size}`);$('#status').textContent=`복원 성공! 카드 ${tc.size}장, 참여 기록 ${nc.size}명. 이제 임시 복원 권한을 반드시 제거하세요.`;}catch(e){$('#status').textContent='복원 중단/오류: '+e.message+'\n일부 배치가 저장되었을 수 있으니 다시 누르지 말고 알려주세요.'}finally{busy=false;update()}};
</script></body></html>
