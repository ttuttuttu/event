<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday 11.11</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');:root{--navy:#14244b;--navy2:#223969;--gold:#d9b974;--cream:#fff9eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#354e7a,#14244b 65%);color:var(--cream);font-family:'Noto Sans KR',sans-serif;min-height:100vh}.wrap{max-width:650px;margin:auto;padding:36px 18px 48px}.eyebrow,.foot,.modalTop{letter-spacing:3px;font-size:10px;color:var(--gold);text-align:center}header{text-align:center;margin:20px 0 28px}h1{font:normal clamp(34px,8vw,56px)/1.14 'DM Serif Display',serif;letter-spacing:2px;margin:0;color:#fff7df}h1 em{font-size:1.25em;font-style:italic;color:var(--gold)}header p{font-size:12px;letter-spacing:2px;color:#d3d9e6;margin-top:16px}.photo{min-height:175px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;margin-bottom:24px;overflow:visible;color:var(--gold);letter-spacing:3px;font:13px 'DM Serif Display',serif}.photo img{display:block;width:auto;max-width:100%;max-height:270px;height:auto;object-fit:contain;padding:0;filter:drop-shadow(0 10px 16px #09132b44)}.photo img[hidden]{display:none}.photo:has(img:not([hidden])){background:transparent}.photo:has(img:not([hidden])) span{display:none}.panel{background:var(--cream);border:5px double #c6a76c;border-radius:12px;color:var(--navy);padding:22px 16px;box-shadow:0 18px 40px #07142a55}.meta{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:1px;border-bottom:1px solid #e7d7b6;padding-bottom:15px;margin-bottom:19px}.meta span:last-child{color:#9a793f}label{font-size:12px;font-weight:700}.inputrow{display:flex;gap:8px;margin:8px 0}.inputrow input{flex:1;min-width:0;border:1px solid #d9caa8;border-radius:7px;background:white;padding:13px;font:14px inherit;outline-color:var(--gold)}.inputrow button{width:45px;background:#e9dfcb;border:0;border-radius:7px;color:#6d624e;font-size:24px}.hint{text-align:center;color:#887e6b;font-size:11px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;background:#e9dec7;border:1px solid #c8b58e;padding:11px;border-radius:9px}.ticket{position:relative;aspect-ratio:0.73;border:0;border-radius:5px;background:linear-gradient(135deg,#2b4277,#142753);color:var(--gold);box-shadow:2px 3px 0 #a7a08e;cursor:pointer;overflow:hidden;transform-style:preserve-3d;transition:transform .2s,opacity .4s}.ticket:not(:disabled):active{transform:scale(.94)}.ticket:before{content:'';position:absolute;inset:5px;border:1px solid #c6a66685;border-radius:3px}.ticket .orn{font:clamp(18px,5vw,31px) 'DM Serif Display',serif;display:block}.ticket .num{font-size:10px;letter-spacing:1px;display:block;margin-top:5px}.ticket.picked{background:#e4d8bd;box-shadow:inset 0 2px 5px #b5a88d;cursor:default;color:#b5a78e}.ticket.picked:before{border:1px dashed #c6b99f}.ticket.picked .orn{opacity:.3}.ticket.tearing{animation:tear .7s ease-in forwards;z-index:2}@keyframes tear{0%{transform:perspective(400px) rotateY(0) translateY(0);opacity:1}45%{transform:perspective(400px) rotateY(-55deg) translateY(-12px);opacity:1}100%{transform:perspective(400px) rotateY(-95deg) translate(18px,-22px);opacity:0}}.foot{margin:25px 0 2px;color:#9e8254}.notice{text-align:center;color:#b6c2d9;font-size:10px;line-height:2}.overlay{position:fixed;inset:0;background:#071327bb;display:grid;place-items:center;padding:20px;z-index:10}.overlay[hidden]{display:none}.modal{width:min(100%,360px);background:var(--cream);color:var(--navy);border:5px double var(--gold);border-radius:12px;text-align:center;padding:30px 22px;box-shadow:0 25px 80px #0006}.spark{font-size:28px;color:var(--gold)}.result-image{display:block;max-width:100%;width:auto;height:auto;max-height:180px;object-fit:contain;margin:8px auto 16px}.result-image[hidden]{display:none}.modalTop{margin-top:12px}.modal h2{font:32px 'DM Serif Display',serif;margin:15px 0}.modal p{line-height:1.8}.modal #resultInfo{font-size:12px;color:#756e62}.modal button{background:var(--navy);color:white;border:0;border-radius:6px;padding:13px 22px;margin-top:15px;font:inherit}@media(max-width:370px){.grid{gap:5px;padding:7px}.panel{padding:15px 10px}.ticket .num{font-size:9px}}
</style></head><body><main class="wrap"><div class="eyebrow">✦ A LITTLE LUCK FOR YOU ✦</div><header><h1>HAPPY BIRTHDAY<br><em>11.11</em></h1><p>오늘의 작은 행운을 골라 주세요</p></header><section class="photo" id="photo"><span>✧ YOUR SPECIAL DAY ✧</span><img id="banner" alt="생일 배너" hidden></section><section class="panel"><div class="meta"><span>LUCKY DRAW · TEST</span><span id="count">10 / 10 LEFT</span></div><label for="nickname">참여 닉네임</label><div class="inputrow"><input id="nickname" maxlength="20" placeholder="닉네임을 입력해 주세요" autocomplete="off"><button id="reset" title="테스트 초기화">↻</button></div><p class="hint">마음에 드는 종이를 하나 골라 터치해 보세요 ♡</p><div id="grid" class="grid" aria-label="뽑기판"></div><p class="foot">✦ MAY YOUR DAY BE FILLED WITH JOY ✦</p></section><p class="notice">디자인 테스트 버전 · 이 기기에만 기록됩니다.<br>실제 이벤트에는 Firebase 연동 후 사용해 주세요.</p></main><div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="spark">✦ ✧ ✦</div><img id="resultImage" class="result-image" alt="당첨 결과 이미지" hidden><p class="modalTop">YOUR LUCKY MOMENT</p><h2 id="resultTitle">축하해요!</h2><p id="resultText"></p><p id="resultInfo"></p><button id="close">확인했어요 ♡</button></div></div><script>
// 이 파일만 수정하면 제목·사진·뽑기 개수·상품 비율을 변경할 수 있어요.
const DRAW_CONFIG = {
  title: "HAPPY BIRTHDAY",
  date: "11.11",
  image: "main-1111.png", // 첫 화면 투명 PNG (index.html과 같은 폴더)
  resultImages: { // 등수별 투명 PNG (index.html과 같은 폴더)
    "1등": "first-1111.png",
    "2등": "second-1111.png",
    "3등": "third-1111.png",
    "꽝": "fail-1111.png"
  },
  total: 10,
  prizes: [
    { name: "1등", count: 1 },
    { name: "2등", count: 1 },
    { name: "3등", count: 2 },
    { name: "꽝", count: 6 }
  ]
};

// ⚠️ 화면 테스트 전용입니다. 실제 당첨 정보는 서버에 숨겨야 합니다.
const C=DRAW_CONFIG, key="birthday-draw-demo-v1", grid=document.querySelector("#grid");
const $=s=>document.querySelector(s);
const prizeList=C.prizes.flatMap(p=>Array(p.count).fill(p.name));
if(prizeList.length!==C.total)throw Error("상품 수량의 합계가 전체 뽑기 수와 달라요.");
const randomInt=max=>Math.floor(Math.random()*max); // 디자인 테스트 전용
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){state=null}
if(!state||state.prizes?.length!==C.total)state={prizes:shuffle([...prizeList]),picked:{},nickname:""};
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};save();
if(C.image){const banner=$("#banner");banner.onload=()=>banner.hidden=false;banner.onerror=()=>{banner.hidden=true;console.warn("첫 화면 이미지를 찾을 수 없습니다:",C.image)};banner.src=C.image}
$("#nickname").value=state.nickname||"";
function render(){grid.innerHTML="";for(let i=0;i<C.total;i++){const b=document.createElement("button");b.className="ticket"+(state.picked[i]?" picked":"");b.disabled=!!state.picked[i];b.innerHTML=`<span class="orn">${state.picked[i]?"✧":"✦"}</span><span class="num">${String(i+1).padStart(3,"0")}</span>`;b.setAttribute("aria-label",`${i+1}번 ${state.picked[i]?"선택 완료":"뽑기"}`);b.onclick=()=>draw(i,b);grid.append(b)}$("#count").textContent=`${C.total-Object.keys(state.picked).length} / ${C.total} LEFT`}
let busy=false;
function draw(i,b){if(busy||state.picked[i])return;const nick=$("#nickname").value.trim();if(!nick){alert("먼저 닉네임을 입력해 주세요!");$("#nickname").focus();return}if(state.nickname&&state.nickname!==nick){alert("이 기기에서는 이미 다른 닉네임으로 참여했어요. (테스트 기록)");return}if(Object.keys(state.picked).length&&state.nickname===nick){alert("테스트에서는 한 번만 참여할 수 있어요. 초기화 버튼으로 다시 테스트해 주세요.");return}busy=true;state.nickname=nick;state.picked[i]={nick,prize:state.prizes[i]};save();b.classList.add("tearing");setTimeout(()=>{render();$("#resultTitle").textContent=state.prizes[i]==="꽝"?"다음 행운을 기다려요 ♡":"🎉 "+state.prizes[i]+" 당첨!";$("#resultText").textContent=state.prizes[i]==="꽝"?"이번에는 아쉽지만, 생일을 함께해 줘서 고마워요!":"반짝이는 행운이 찾아왔어요!";$("#resultInfo").textContent=`${nick} 님 · ${String(i+1).padStart(3,"0")}번 · ${state.prizes[i]}`;const img=$("#resultImage"),src=C.resultImages?.[state.prizes[i]];img.hidden=true;img.removeAttribute("src");if(src){img.onload=()=>img.hidden=false;img.onerror=()=>{img.hidden=true;console.warn("결과 이미지를 찾을 수 없습니다:",src)};img.src=src}$("#overlay").hidden=false;busy=false},730)}
$("#close").onclick=()=>$("#overlay").hidden=true;
$("#reset").onclick=()=>{if(confirm("이 기기의 테스트 기록을 초기화할까요?")){try{localStorage.removeItem(key)}catch(e){};state={prizes:shuffle([...prizeList]),picked:{},nickname:""};$("#nickname").value="";save();render()}};
render();

</script></body></html>
