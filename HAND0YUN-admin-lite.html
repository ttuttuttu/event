<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOYUN · 간편 관리자</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1830;color:#f7eedb;font-family:system-ui,'Noto Sans KR',sans-serif;padding:22px 14px}main{max-width:820px;margin:auto}h1{font-size:24px;margin:7px 0 5px}.sub{color:#b8c6d8;font-size:13px;line-height:1.7}.tag{color:#e8cc91;font-size:11px;letter-spacing:.18em;font-weight:800}.card{background:#142747;border:1px solid #51627e;border-radius:16px;padding:18px;margin-top:16px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.btn{background:#1b3154;color:#f7eedb;border:1px solid #73829b;border-radius:9px;padding:12px;font:inherit;cursor:pointer}.btn.active,.primary{background:#e8cc91;color:#142747;border-color:#e8cc91;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.actions button{flex:1;min-width:130px}.btn:disabled{opacity:.5;cursor:wait}.stats{font-size:19px;font-weight:800;margin:14px 0}.status{font-size:13px;color:#d3dfef;overflow-wrap:anywhere;line-height:1.6}.groups{display:grid;gap:11px}.group{background:#1a3155;border:1px solid #435b7d;border-radius:11px;overflow:hidden}.group header{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #405774}.group header span{font-size:12px;color:#e8cc91}.items{padding:6px 14px}.item{padding:9px 0;border-bottom:1px solid #354b6a;display:flex;gap:14px;font-size:14px}.item:last-child{border:0}.num{color:#e8cc91;min-width:48px}.empty{color:#b8c6d8;font-size:13px;padding:9px 0}.note{font-size:12px;color:#b8c6d8;line-height:1.7}a{color:#e8cc91}[hidden]{display:none!important}
</style></head><body><main><div class="tag">PRIVATE ACCESS · LIGHT MODE</div><h1>DOYUN · 간편 관리자</h1><p class="sub">참여 인원과 당첨자만 확인하는 읽기 전용 페이지 · 자동 새로고침 없음</p><section class="card"><div class="tabs"><button class="btn active" data-key="mutual">💙 맞팔용 1111</button><button class="btn" data-key="general">💜 일반용 2026</button></div><div class="actions"><button class="btn primary" id="login">Google 로그인</button><button class="btn" id="load" disabled>참여 현황 조회</button><button class="btn" id="logout" hidden>로그아웃</button></div><p id="account" class="status">로그인이 필요합니다.</p><p id="status" class="status" role="status"></p></section><section class="card" id="results" hidden><div class="tag" id="eventName"></div><p class="stats" id="stats"></p><div class="groups" id="groups"></div></section><p class="note">조회 버튼을 누를 때만 해당 이벤트에서 <b>선택된 카드</b>를 읽습니다. 200장 전체나 꽝 카드 전체를 매번 내려받지 않습니다. 다만 이미 선택된 꽝 카드도 참여 인원을 정확히 계산하기 위해 읽습니다. 실제 Firestore 읽기 횟수는 캐시·쿼리 결과 등에 따라 달라집니다. 관리자 계정의 접근 권한은 각 Firebase 프로젝트의 보안 규칙에 따릅니다.</p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const configs={mutual:{apiKey:'AIzaSyAfMZkm4OyxuF3I03hbejveZeWXdwfCp7I',authDomain:'doyun-1111.firebaseapp.com',projectId:'doyun-1111',storageBucket:'doyun-1111.firebasestorage.app',messagingSenderId:'551075012657',appId:'1:551075012657:web:306e90fc84419eaf847510'},general:{apiKey:'AIzaSyCJXaEaB3aAkXRukNtrkHNcR7ig0YMBgZE',authDomain:'doyun-2026.firebaseapp.com',projectId:'doyun-2026',storageBucket:'doyun-2026.firebasestorage.app',messagingSenderId:'820277254538',appId:'1:820277254538:web:40a15e3cfcc7297d6b9073'}};
const projects={};for(const key of Object.keys(configs)){const app=firebase.initializeApp(configs[key],key);projects[key]={auth:app.auth(),db:app.firestore()}}
const $=s=>document.querySelector(s),GROUPS=[['1등','1등'],['2등','2등'],['3등','3등'],['스페셜 ①','11.11 SPECIAL ①'],['스페셜 ②','11.11 SPECIAL ②']];let selected='mutual',requestId=0;
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function updateAccount(){const u=projects[selected].auth.currentUser;$('#account').textContent=u?`로그인됨: ${u.email||'Google 계정'} · ${selected==='mutual'?'맞팔용':'일반용'}`:'이 프로젝트에는 아직 로그인하지 않았습니다.';$('#login').hidden=!!u;$('#logout').hidden=!u;$('#load').disabled=!u}
function choose(key){selected=key;++requestId;document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('active',b.dataset.key===key));$('#results').hidden=true;$('#status').textContent='';updateAccount()}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>choose(b.dataset.key));
for(const key of Object.keys(projects))projects[key].auth.onAuthStateChanged(()=>{if(selected===key)updateAccount()});
$('#login').onclick=async()=>{const key=selected,a=projects[key].auth;$('#status').textContent='로그인 중...';try{await a.signInWithPopup(new firebase.auth.GoogleAuthProvider());$('#status').textContent='로그인 성공! 참여 현황 조회를 눌러 주세요.'}catch(e){$('#status').textContent=`로그인 실패 (${e.code||''}): ${e.message} · 팝업이 차단되었다면 브라우저에서 팝업을 허용해 주세요.`}};
$('#logout').onclick=async()=>{try{await projects[selected].auth.signOut();++requestId;$('#results').hidden=true;$('#status').textContent='로그아웃했습니다.'}catch(e){$('#status').textContent=e.message}};
$('#load').onclick=async()=>{const key=selected,id=++requestId,{auth,db}=projects[key];if(!auth.currentUser)return;$('#load').disabled=true;$('#results').hidden=true;$('#status').textContent='선택된 카드만 불러오는 중...';try{const snap=await db.collection('events').doc(key).collection('tickets').where('picked','==',true).get();if(id!==requestId)return;const entries=snap.docs.map(d=>({number:Number(d.id),...d.data()})).sort((a,b)=>a.number-b.number);$('#eventName').textContent=key==='mutual'?'맞팔용 · 1111':'일반용 · 2026';$('#stats').textContent=`참여 ${entries.length}명 / 전체 200장 · 남은 카드 ${200-entries.length}장`;$('#groups').replaceChildren();for(const [label,prize] of GROUPS){const members=entries.filter(d=>d.prize===prize);const box=element('section','group'),head=element('header');head.append(element('strong','',label),element('span','',`${members.length}명`));box.append(head);const list=element('div','items');if(!members.length)list.append(element('div','empty','아직 당첨자가 없습니다.'));for(const m of members){const row=element('div','item');row.append(element('span','num',`${m.number}번`),element('span','',m.nickname||'X 아이디 미기록'));list.append(row)}box.append(list);$('#groups').append(box)}$('#results').hidden=false;$('#status').textContent=`조회 완료 · 선택된 카드 ${entries.length}건만 조회했습니다. (꽝 당첨자 명단은 표시하지 않음)`}catch(e){if(id===requestId)$('#status').textContent=`조회 실패 (${e.code||''}): ${e.message}`}finally{if(id===requestId)$('#load').disabled=!auth.currentUser}};
updateAccount();
</script></body></html>
